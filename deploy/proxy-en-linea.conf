# Ejemplo de proxy con TLS para la demo en línea. El puerto 8080 del contenedor no se abre a internet.
# El límite cuenta solo los POST (subir un video, arreglar el arranque, traducir). Con la clave vacía nginx no limita, y el panel
# consulta el avance cada 1.2 s (50 por minuto): contado también, él solo se pasaría de 30 por minuto.
map $request_method $clave_limite_post { POST $binary_remote_addr; default ""; }
limit_req_zone $clave_limite_post zone=retina_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=retina_con:10m;

server {
    listen 80;
    server_name retina.ejemplo.com;
    server_tokens off;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name retina.ejemplo.com;
    # ssl_certificate y ssl_certificate_key: los de tu dominio
    server_tokens off;
    client_max_body_size 200m;
    client_body_timeout 120s;
    limit_conn retina_con 10;

    # Las cabeceras van escritas aquí y no en un include: el archivo de parámetros del proxy solo viene en Debian y Ubuntu.
    # La app revisa el Host, así que tiene que llegarle el del dominio y no el de 127.0.0.1.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / { return 302 /panel/; }
    location /api/revisar { client_max_body_size 200m; limit_req zone=retina_api burst=5 nodelay; proxy_pass http://127.0.0.1:8080; proxy_request_buffering off; }  # la app corta sin código de acceso antes de leer el video
    location /api/traducir/ { client_max_body_size 1k; limit_req zone=retina_api burst=10 nodelay; proxy_pass http://127.0.0.1:8080; }
    location /api/apertura/ { client_max_body_size 1k; limit_req zone=retina_api burst=60 nodelay; proxy_pass http://127.0.0.1:8080; }
    location / { client_max_body_size 1k; proxy_pass http://127.0.0.1:8080; }
}
