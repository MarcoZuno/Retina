# Ejemplo de proxy con TLS para la demo en línea. El puerto 8080 del contenedor no se abre a internet.
limit_req_zone $binary_remote_addr zone=retina_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=retina_con:10m;

server {
    listen 443 ssl;
    server_name retina.ejemplo.com;
    # ssl_certificate y ssl_certificate_key: los de tu servidor
    server_tokens off;
    client_max_body_size 200m;
    client_body_timeout 120s;
    limit_conn retina_con 10;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / { return 302 /panel/; }
    location /api/revisar { limit_req zone=retina_api burst=5 nodelay; proxy_pass http://127.0.0.1:8080; include proxy_params; proxy_request_buffering on; }
    location /api/apertura/ { limit_req zone=retina_api burst=60 nodelay; proxy_pass http://127.0.0.1:8080; include proxy_params; }
    location / { proxy_pass http://127.0.0.1:8080; include proxy_params; }
}
