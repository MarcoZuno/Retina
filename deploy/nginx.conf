server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / { return 302 /panel/?caso=/casos/demo/resultado.json; }
    location /panel/ { try_files $uri $uri/index.html =404; }
    location ~ ^/casos/[A-Za-z0-9_-]+/(resultado|comparacion)\.json$ { default_type application/json; }
    # Lo mismo que deja ver el servidor de Python (demo.PERMITIDO): el primer cuadro y lo dibujado con Muse Image.
    location ~ ^/casos/[A-Za-z0-9_-]+/(apertura-antes\.(jpg|webp)|[A-Za-z0-9_-]+-ilustracion-ia\.(png|webp))$ { }
    location / { return 404; }
}
