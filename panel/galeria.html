<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Retina · casos</title>
<style>
:root {
  --texto: #FFFFFF; --suave: rgba(255,255,255,.80); --tenue: rgba(255,255,255,.58);
  --rojo: #FF6B6E; --rojo-vidrio: rgba(255,90,95,.30); --rojo-letra: #FFE1E2;
  --ambar: #FFC46B; --ambar-vidrio: rgba(255,180,80,.26); --ambar-letra: #FFEBC7;
  --verde: #7CF0B5; --verde-vidrio: rgba(124,240,181,.22); --verde-letra: #DDFBEA;
  --nivel: var(--rojo); --nivel-vidrio: var(--rojo-vidrio); --nivel-letra: var(--rojo-letra);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { color: var(--texto); font: 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
       background: #050B1C center / cover fixed no-repeat; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(180deg, rgba(5,11,28,.35), rgba(5,11,28,.70)); z-index: 0; }
.capa { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 18px 22px 60px; }
.vidrio { border-radius: 24px; background: rgba(10,20,46,.38); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 24px 60px -18px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.5), inset 0 0 0 1px rgba(255,255,255,.16); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 26px; }
.marca { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: 999px; font-weight: 650; }
.marca i { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #9FD3FF 45%, #3F7BFF); box-shadow: 0 0 14px #9FD3FF; }
h1 { font-size: 40px; line-height: 1.1; margin: 0 0 8px; letter-spacing: -.01em; }
.sub { color: var(--suave); max-width: 760px; margin: 0 0 22px; font-size: 18px; }
.resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 26px; }
.resumen div { padding: 18px 20px; }
.resumen b { display: block; font-size: 30px; line-height: 1.1; margin-bottom: 6px; }
.resumen span { color: var(--suave); font-size: 14px; }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.filtro { font: inherit; font-size: 14px; font-weight: 600; color: var(--texto); border: 0; cursor: pointer; padding: 8px 16px; border-radius: 999px;
  background: rgba(255,255,255,.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
.filtro[aria-pressed="true"] { background: #fff; color: #0E1A33; }
a.filtro { text-decoration: none; }
.filtro:focus-visible, .caso:focus-visible { outline: 3px solid #9FD3FF; outline-offset: 3px; }
.cuenta { color: var(--tenue); font-size: 14px; margin: 0 0 14px; }
.casos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.caso { display: flex; flex-direction: column; color: inherit; text-decoration: none; overflow: hidden; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.caso:hover { transform: translateY(-3px); }
.foto { aspect-ratio: 4 / 3; background: linear-gradient(135deg, var(--nivel-vidrio), rgba(255,255,255,.04)); }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cuerpo { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 650;
  background: var(--nivel-vidrio); color: var(--nivel-letra); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--nivel); box-shadow: 0 0 10px var(--nivel); }
.nivel-alto { --nivel: var(--rojo); --nivel-vidrio: var(--rojo-vidrio); --nivel-letra: var(--rojo-letra); }
.nivel-medio { --nivel: var(--ambar); --nivel-vidrio: var(--ambar-vidrio); --nivel-letra: var(--ambar-letra); }
.nivel-bajo { --nivel: var(--verde); --nivel-vidrio: var(--verde-vidrio); --nivel-letra: var(--verde-letra); }
.caso h2 { font-size: 16.5px; line-height: 1.3; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cambio { color: var(--suave); font-size: 14px; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cambio b { color: var(--texto); }
.pie { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--tenue); font-size: 13px; }
.real { display: inline-flex; align-items: center; gap: 6px; }
.real i { width: 8px; height: 8px; border-radius: 50%; }
.real.de-mas i { background: var(--rojo); } .real.normal i { background: var(--verde); }
.aviso { padding: 22px; color: var(--suave); }
.oculto { display: none !important; }
.nota { color: var(--tenue); font-size: 13px; margin-top: 26px; }
@media (max-width: 640px) { .capa { padding: 14px 16px 40px; } h1 { font-size: 30px; } .sub { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) { .caso { transition: none; } }
</style>
</head>
<body>
<div class="capa">
  <header>
    <span class="marca vidrio"><i></i>Retina</span>
    <a class="filtro" href="index.html">Abrir el panel</a>
  </header>
  <h1 id="titulo">Casos revisados por Retina</h1>
  <p class="sub" id="sub"></p>
  <div class="resumen oculto" id="resumen"></div>
  <div class="filtros" id="filtros" role="group" aria-label="Filtrar casos"></div>
  <p class="cuenta" id="cuenta" aria-live="polite"></p>
  <div class="casos" id="casos"></div>
  <div class="aviso vidrio oculto" id="aviso"></div>
  <p class="nota" id="nota"></p>
</div>
<script>
"use strict";
// Todo lo que viene de indice.json entra como texto, nunca como HTML. Las carpetas y las ilustraciones
// solo se aceptan con nombres sueltos y seguros, y siempre de /casos/ en este mismo sitio.
const $ = (id) => document.getElementById(id);
const CARPETA = /^[\w-]+$/, ILUSTRACION = /^[\w-]+-ilustracion-ia\.(png|webp)$/;
const NIVELES = { alto: "Riesgo alto", medio: "Riesgo medio", bajo: "Sin problema claro" };
const FONDOS = { cristales: "cinta", oceano: "oceano", aurora: "aurora", montanas: "montanas", seda: "seda", espacio: "espacio" };

function nodo(tag, clase, texto) { const n = document.createElement(tag); if (clase) n.className = clase; if (texto !== undefined) n.textContent = texto; return n; }
function mmss(s) { s = Math.round(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

let fondo = "oceano";
try { fondo = FONDOS[localStorage.getItem("retina-fondo")] || "oceano"; } catch (_) { /* sin almacenamiento */ }
document.body.style.backgroundImage = `url("fondos/fondo-${fondo}.webp")`;

function tarjeta(c) {
  const nivel = NIVELES[c.nivel] ? c.nivel : "medio";
  const a = nodo("a", `caso vidrio nivel-${nivel}`);
  a.href = `index.html?caso=${encodeURIComponent(`/casos/${c.carpeta}/resultado.json`)}&desde=galeria`;
  const foto = nodo("div", "foto");
  if (typeof c.ilustracion === "string" && ILUSTRACION.test(c.ilustracion)) {
    const img = nodo("img"); img.loading = "lazy"; img.alt = "";
    img.src = `../casos/${c.carpeta}/${c.ilustracion}`;
    foto.append(img);
  }
  const cuerpo = nodo("div", "cuerpo");
  const chip = nodo("span", "chip"); chip.append(nodo("i"), document.createTextNode(c.anzuelo ? `${NIVELES[nivel]} · trae anzuelo` : NIVELES[nivel]));
  const cambio = nodo("p", "cambio");
  if (c.que_cambiar) cambio.append(nodo("b", "", "Qué cambiar: "), document.createTextNode(String(c.que_cambiar)));
  else cambio.textContent = nivel === "bajo" ? "No hace falta cambiar el inicio." : "Revisar el inicio a mano.";
  const pie = nodo("div", "pie");
  pie.append(nodo("span", "", [c.fecha, c.duracion_s ? mmss(c.duracion_s) : ""].filter(Boolean).join(" · ")));
  if (c.real === "de_mas" || c.real === "normal") {
    const r = nodo("span", `real ${c.real === "de_mas" ? "de-mas" : "normal"}`);
    r.append(nodo("i"), document.createTextNode(c.real === "de_mas" ? "De verdad perdió más gente al inicio" : "De verdad no perdió de más"));
    pie.append(r);
  }
  cuerpo.append(chip, nodo("h2", "", String(c.titulo || "Sin título")), cambio, pie);
  a.append(foto, cuerpo);
  return a;
}

function pintar(casos, filtro) {
  const vis = casos.filter(filtro.prueba);
  $("casos").replaceChildren(...vis.map(tarjeta));
  $("cuenta").textContent = `${vis.length} de ${casos.length} casos`;
}

(async () => {
  let d;
  try {
    const r = await fetch("../casos/indice.json");
    if (!r.ok) throw new Error();
    d = await r.json();
  } catch (_) {
    $("aviso").textContent = "No hay galería en esta carpeta. Se abre con «python -m retina.demo --casos CARPETA --galeria», con una carpeta que traiga indice.json.";
    $("aviso").classList.remove("oculto");
    return;
  }
  const casos = (Array.isArray(d.casos) ? d.casos : []).filter((c) => c && typeof c.carpeta === "string" && CARPETA.test(c.carpeta));
  if (d.titulo) { $("titulo").textContent = String(d.titulo); document.title = `Retina · ${d.titulo}`; }
  $("sub").textContent = String(d.subtitulo || "");
  const resumen = Array.isArray(d.resumen) ? d.resumen.slice(0, 4) : [];
  $("resumen").classList.toggle("oculto", !resumen.length);
  $("resumen").replaceChildren(...resumen.map((x) => { const t = nodo("div", "vidrio"); t.append(nodo("b", "", String(x.cifra)), nodo("span", "", String(x.texto))); return t; }));
  $("nota").textContent = String(d.nota || "");
  const filtros = [
    { nombre: "Todos", prueba: () => true },
    { nombre: "Riesgo alto", prueba: (c) => c.nivel === "alto" },
    { nombre: "Riesgo medio", prueba: (c) => c.nivel === "medio" },
    { nombre: "Sin problema claro", prueba: (c) => c.nivel === "bajo" },
    { nombre: "Con anzuelo", prueba: (c) => !!c.anzuelo },
  ];
  if (casos.some((c) => c.real)) filtros.push({ nombre: "Perdieron más gente", prueba: (c) => c.real === "de_mas" });
  const botones = filtros.map((f, i) => {
    const b = nodo("button", "filtro", f.nombre); b.type = "button"; b.setAttribute("aria-pressed", String(i === 0));
    b.onclick = () => { botones.forEach((x) => x.setAttribute("aria-pressed", String(x === b))); pintar(casos, f); };
    return b;
  });
  $("filtros").replaceChildren(...botones);
  pintar(casos, filtros[0]);
})();
</script>
</body>
</html>
