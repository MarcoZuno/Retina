<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retina</title>
<style>
  :root {
    --fondo: #f6f5f2; --tarjeta: #ffffff; --texto: #1c1b19; --suave: #6b6862; --linea: #e2dfd8;
    --predicha: #1c1b19; --parecidos: #8a867e; --ambar: #e8a33d; --ambar-fondo: #fdf1dc;
    --rojo: #c8412f; --rojo-fondo: #fbe6e2; --boton: #1c1b19; --boton-texto: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #141412; --tarjeta: #1f1e1b; --texto: #f1efe9; --suave: #a29e95; --linea: #33312c;
            --predicha: #f1efe9; --parecidos: #8a867e; --ambar-fondo: #3a2d16; --rojo-fondo: #3b1d18;
            --boton: #f1efe9; --boton-texto: #141412; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  header p { margin: 2px 0 24px; color: var(--suave); }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .subir { text-align: center; border-style: dashed; padding: 40px 20px; cursor: pointer; }
  .pasos { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; color: var(--suave); font-size: 14px; }
  .pasos span::after { content: "·"; margin-left: 8px; } .pasos span:last-child::after { content: ""; }
  h2 { margin: 0 0 4px; font-size: 20px; }
  .leyenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--suave); margin: 8px 0 0; }
  .leyenda i { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--predicha); vertical-align: middle; margin-right: 6px; }
  .leyenda i.p { border-top: 2px dashed var(--parecidos); } .leyenda i.a { border-top: 8px solid var(--ambar); opacity: .5; }
  svg { width: 100%; height: auto; display: block; }
  .riesgo { border-left: 6px solid var(--ambar); background: var(--ambar-fondo); }
  .riesgo .cuando { font-weight: 700; font-size: 18px; }
  .cifra { color: var(--suave); margin: 6px 0 12px; }
  .cambio { font-weight: 600; }
  .alerta { border-left: 6px solid var(--rojo); background: var(--rojo-fondo); }
  .botones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  button { font: inherit; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--boton); }
  button.principal { background: var(--boton); color: var(--boton-texto); }
  button.secundario { background: transparent; color: var(--texto); }
  .licencia { font-size: 13px; color: var(--suave); }
  .licencia ul { margin: 4px 0 0; padding-left: 18px; }
  .oculto { display: none; }
  .storyboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .storyboard div { background: var(--fondo); border: 1px solid var(--linea); border-radius: 10px; padding: 10px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Retina</h1>
    <p>Antes de publicar, ve dónde se va tu público.</p>
  </header>

  <section id="pantalla-subir" class="tarjeta subir" tabindex="0">
    <strong>Abre la revisión de tu video</strong>
    <div class="cifra">Elige el archivo <code>resultado.json</code> que dejó Retina en la carpeta del video.</div>
    <input id="archivo" type="file" accept=".json,application/json" class="oculto">
    <div class="pasos"><span>Viendo</span><span>Escuchando</span><span>Comparando</span><span>Dibujando</span></div>
  </section>

  <section id="pantalla-resultado" class="oculto">
    <div class="tarjeta">
      <h2 id="titular">Aquí se va más gente de lo normal</h2>
      <div class="cifra" id="subtitulo"></div>
      <svg id="grafica" viewBox="0 0 800 300" role="img" aria-label="Curva de retención predicha"></svg>
      <div class="leyenda"><span><i></i>Tu video (predicción)</span><span><i class="p"></i>Videos parecidos</span><span><i class="a"></i>Tramo de riesgo</span></div>
    </div>

    <div id="alerta" class="tarjeta alerta oculto"></div>

    <div class="tarjeta riesgo">
      <div class="cuando" id="cuando"></div>
      <div class="cifra" id="comparacion"></div>
      <div id="porque"></div>
      <p class="cambio" id="cambio"></p>
      <div class="botones"><button class="secundario" id="ver-storyboard">Ver storyboard</button></div>
      <div id="storyboard" class="storyboard oculto"></div>
    </div>

    <div class="tarjeta">
      <div class="botones">
        <button class="principal" id="regrabar">Regrabar</button>
        <button class="secundario" id="publicar">Publicar igual</button>
      </div>
      <p class="cifra" id="decision"></p>
      <div class="licencia" id="licencia"></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;

function grafica(r) {
  const p = r.prediccion, dur = r.video.duracion_s, W = 800, H = 300, m = { i: 44, d: 12, a: 12, b: 32 };
  const x = (i) => m.i + (i / 40) * (W - m.i - m.d);
  const y = (v) => m.a + (1 - v) * (H - m.a - m.b);
  const linea = (c) => c.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const t = r.tramo_riesgo.indice;
  let svg = `<rect x="${x(t)}" y="${m.a}" width="${x(t + 1) - x(t)}" height="${H - m.a - m.b}" fill="var(--ambar)" opacity=".35"/>`;
  for (const v of [0, .25, .5, .75, 1]) {
    svg += `<line x1="${m.i}" x2="${W - m.d}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linea)"/>`;
    svg += `<text x="${m.i - 8}" y="${y(v) + 4}" font-size="12" text-anchor="end" fill="var(--suave)">${v * 100}%</text>`;
  }
  for (const f of [0, .25, .5, .75, 1]) {
    svg += `<text x="${x(f * 40)}" y="${H - 10}" font-size="12" text-anchor="middle" fill="var(--suave)">${mmss(f * dur)}</text>`;
  }
  svg += `<path d="${linea(p.curva_parecidos)}" fill="none" stroke="var(--parecidos)" stroke-width="2" stroke-dasharray="5 5"/>`;
  svg += `<path d="${linea(p.curva_predicha)}" fill="none" stroke="var(--predicha)" stroke-width="2.5"/>`;
  $("grafica").innerHTML = svg;
}

function mostrar(r) {
  const p = r.prediccion, e = r.explicacion, t = r.tramo_riesgo, l = r.licencia;
  $("subtitulo").textContent = `Video de ${mmss(r.video.duracion_s)}. La línea es cuánta gente seguiría viendo en cada momento.`;
  grafica(r);
  $("cuando").textContent = `${mmss(t.inicio_s)} a ${mmss(t.fin_s)}${e && e.por_que ? "" : " · aquí se va más gente que en videos parecidos"}`;
  $("comparacion").textContent = `Videos parecidos pierden ${p.caida_parecidos_pp} de cada 100 aquí; este perdería ${p.caida_predicha_pp}.`;
  if (e) {
    $("porque").textContent = e.por_que;
    $("cambio").textContent = e.que_cambiar ? `Qué cambiar: ${e.que_cambiar}` : "No hay una sugerencia que pase nuestras reglas de integridad. Mejor revisa este tramo a mano.";
    const cuadros = e.storyboard || [];
    $("ver-storyboard").classList.toggle("oculto", !cuadros.length);
    $("storyboard").innerHTML = cuadros.map((c, i) => `<div><strong>${i + 1}.</strong> ${c.replace(/</g, "&lt;")}</div>`).join("");
    if (e.anzuelo_detectado && e.anzuelo_detectado !== "ninguno") {
      $("alerta").classList.remove("oculto");
      $("alerta").innerHTML = `<strong>Esto Meta lo castiga en la distribución.</strong><br>El borrador trae: ${e.anzuelo_detectado.replace(/_/g, " ")}. Retina no lo sugiere nunca; quítalo antes de publicar.`;
    }
  } else {
    $("porque").textContent = "Todavía no hay explicación: esta revisión se hizo sin la API de Meta, así que solo vemos dónde cae, no por qué.";
    $("cambio").textContent = "";
    $("ver-storyboard").classList.add("oculto");
  }
  const confianza = l.vio_el_video ? "media" : "baja";
  $("licencia").innerHTML = `<strong>Confianza: ${confianza}.</strong> Comparado con ${l.comparado_con}; datos al ${l.datos_hasta}. `
    + (l.vio_el_video ? "Retina vio el video tramo a tramo." : "Retina no vio el video; solo usó sus datos.")
    + `<br>No pude revisar:<ul>${l.no_pude_revisar.map((n) => `<li>${n}</li>`).join("")}</ul>`;
  $("pantalla-subir").classList.add("oculto");
  $("pantalla-resultado").classList.remove("oculto");
}

$("ver-storyboard").onclick = () => $("storyboard").classList.toggle("oculto");
$("regrabar").onclick = () => $("decision").textContent = "Anotado: regrabas. Cuando tengas la nueva versión, revísala otra vez y compara.";
$("publicar").onclick = () => $("decision").textContent = "Anotado: se publica igual. Mañana Retina compara la curva real con esta.";
$("pantalla-subir").onclick = () => $("archivo").click();
$("pantalla-subir").onkeydown = (ev) => { if (ev.key === "Enter") $("archivo").click(); };
$("archivo").onchange = async (ev) => mostrar(JSON.parse(await ev.target.files[0].text()));
fetch("resultado.json").then((r) => r.ok ? r.json() : null).then((r) => r && mostrar(r)).catch(() => {});
</script>
</body>
</html>
